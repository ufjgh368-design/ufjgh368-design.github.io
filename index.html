<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳澄波生命地圖：抉擇與最終試煉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: 'Noto Serif TC', serif, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; transition: filter 1s ease; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Stats Panel */
        #stats-panel { pointer-events: auto; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); transition: all 0.5s ease; }
        .stat-bar-bg { background: rgba(255,255,255,0.1); width: 100%; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .stat-bar-fill { background: linear-gradient(90deg, #d4af37, #f3e5ab); height: 100%; width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-diff { font-size: 0.7rem; margin-left: 4px; font-weight: bold; opacity: 0; transition: opacity 0.5s; }
        .stat-diff.pos { color: #4ade80; opacity: 1; }
        .stat-diff.neg { color: #f87171; opacity: 1; }
        
        /* Subtitle Box */
        #subtitle-box { background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: auto; }
        .typewriter { border-right: .15em solid orange; white-space: pre-wrap; margin: 0 auto; letter-spacing: .05em; animation: blink-caret .75s step-end infinite; }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: rgba(255,215,0,0.8); } }

        /* Overlays (Decision & Alternate) */
        .overlay-screen { position: absolute; inset: 0; display: none; flex-direction: column; items-center: center; justify-content: center; padding: 1rem; opacity: 0; transition: opacity 0.5s; z-index: 40; pointer-events: auto; }
        .overlay-screen.active { display: flex; opacity: 1; }
        
        #decision-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        #alternate-overlay { background: radial-gradient(circle, rgba(20,20,20,0.95) 0%, rgba(0,0,0,1) 100%); }
        #quiz-overlay { background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(15px); z-index: 50; }

        .btn-choice { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 215, 0, 0.5); transition: all 0.3s; position: relative; overflow: hidden; cursor: pointer; }
        .btn-choice::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent); transition: left 0.5s; }
        .btn-choice:hover::before { left: 100%; }
        .btn-choice:hover { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); transform: translateY(-2px); }

        .glitch-text { text-shadow: 2px 0 0 red, -2px 0 0 cyan; animation: glitch 2s infinite linear alternate-reverse; }
        @keyframes glitch { 0% { text-shadow: 2px 0 0 red, -2px 0 0 cyan; } 20% { text-shadow: -2px 0 0 red, 2px 0 0 cyan; } 40% { text-shadow: 2px 0 0 red, -2px 0 0 cyan; } 100% { text-shadow: -2px 0 0 red, 2px 0 0 cyan; } }

        /* Start Screen */
        #start-screen { background-color: #050505; pointer-events: auto; z-index: 60; display: flex; }
        .title-glow { text-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 0 0 40px rgba(255, 215, 0, 0.1); }
        .floating-year { position: absolute; color: rgba(255, 255, 255, 0.2); font-size: 8rem; font-weight: bold; pointer-events: none; z-index: 2; right: 5%; top: 15%; mix-blend-mode: overlay; transition: opacity 1s; }
        .filter-grayscale { filter: grayscale(100%) contrast(1.2) brightness(0.7); }
        .filter-blur { filter: blur(8px); }

        /* Quiz Specifics */
        .quiz-option { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); padding: 1rem; border-radius: 0.5rem; text-align: left; transition: all 0.2s; cursor: pointer; }
        .quiz-option:hover { background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.5); transform: translateX(5px); }
        .quiz-option.selected-correct { background: rgba(34, 197, 94, 0.2); border-color: rgb(34, 197, 94); }
        .quiz-option.selected-wrong { background: rgba(239, 68, 68, 0.2); border-color: rgb(239, 68, 68); }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 flex-col items-center justify-center">
        <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-600 via-yellow-200 to-yellow-600 title-glow mb-4 tracking-widest text-center">陳澄波<br><span class="text-3xl md:text-4xl text-gray-400 mt-4 block">生命地圖與最終試煉</span></h1>
        <p class="text-gray-400 mb-12 text-center max-w-2xl px-4 leading-relaxed">
            體驗先驅在時代裂縫中的光芒與代價。<br>故事結束後，將進行五題學習成效測驗，超過 60 分始可過關。
        </p>
        <button id="start-btn" class="px-8 py-3 border border-yellow-600 text-yellow-500 hover:bg-yellow-600 hover:text-white transition-all duration-500 tracking-widest text-lg rounded-sm">進入生命地圖</button>
    </div>

    <!-- Alternate History Overlay -->
    <div id="alternate-overlay" class="overlay-screen">
        <div class="max-w-3xl w-full text-center mx-auto">
            <h2 class="text-4xl md:text-5xl font-bold text-gray-500 mb-2 tracking-widest">【平行時空】</h2>
            <h3 id="alt-title" class="text-2xl text-red-400 glitch-text mb-8">未曾發生的結局</h3>
            <p id="alt-desc" class="text-lg md:text-xl text-gray-300 leading-loose mb-12 border-l-4 border-gray-600 pl-6 text-left"></p>
            <button id="rewind-btn" class="px-8 py-4 border border-blue-400 text-blue-300 hover:bg-blue-900/50 hover:text-white transition-all duration-300 tracking-widest text-lg flex items-center justify-center mx-auto gap-3">
                時光倒流：回歸真實歷史
            </button>
        </div>
    </div>

    <!-- Quiz Overlay -->
    <div id="quiz-overlay" class="overlay-screen">
        <div class="max-w-4xl w-full mx-auto bg-black/80 border border-yellow-600/30 p-8 md:p-12 rounded-xl shadow-2xl relative">
            
            <!-- Quiz Progress/Question Container -->
            <div id="quiz-question-container">
                <div class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
                    <h2 class="text-2xl font-bold text-yellow-500 tracking-widest">學習成效測驗</h2>
                    <span id="quiz-progress" class="text-gray-400 font-mono text-lg">1 / 5</span>
                </div>
                
                <h3 id="quiz-question-text" class="text-xl md:text-2xl text-white mb-8 leading-relaxed"></h3>
                
                <div id="quiz-options" class="flex flex-col gap-4 mb-6">
                    <!-- Options injected here -->
                </div>

                <div id="quiz-feedback" class="hidden p-4 rounded bg-gray-800 border-l-4 border-yellow-500 mb-6 text-gray-200 text-sm md:text-base"></div>
                
                <button id="quiz-next-btn" class="hidden w-full px-6 py-3 bg-yellow-600 hover:bg-yellow-500 text-black font-bold tracking-widest rounded transition-colors">下一題</button>
            </div>

            <!-- Quiz Result Container -->
            <div id="quiz-result-container" class="hidden flex-col items-center justify-center text-center py-10">
                <h2 class="text-3xl font-bold mb-6 tracking-widest" id="result-title">測驗結果</h2>
                <div class="text-6xl font-bold text-yellow-500 mb-4" id="result-score">0</div>
                <p class="text-gray-400 mb-8">滿分 100 分 (過關標準：大於 60 分)</p>
                <p id="result-message" class="text-xl mb-10 leading-relaxed text-gray-200 max-w-2xl mx-auto"></p>
                
                <div id="result-actions" class="flex gap-4">
                    <button id="retry-quiz-btn" class="px-8 py-3 border border-yellow-600 text-yellow-500 hover:bg-yellow-600 hover:text-black transition-all tracking-widest rounded hidden">重新挑戰測驗</button>
                    <button id="finish-btn" class="px-8 py-3 bg-green-600 hover:bg-green-500 text-white transition-all tracking-widest rounded hidden shadow-[0_0_20px_rgba(34,197,94,0.4)]">完美通關</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main UI Layer -->
    <div id="ui-layer" class="hidden opacity-0 transition-opacity duration-1000">
        <div class="p-6 flex justify-between items-start">
            <div class="pointer-events-none">
                <h2 id="location-title" class="text-3xl font-bold text-yellow-500 tracking-wider drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]"></h2>
                <p id="location-sub" class="text-gray-300 text-sm mt-1"></p>
            </div>
            <div id="stats-panel" class="w-64 p-4 rounded-lg hidden md:block">
                <h3 class="text-yellow-500 text-sm font-bold border-b border-yellow-700/50 pb-2 mb-3 tracking-widest">生命能力值</h3>
                <div class="space-y-3" id="stats-container"></div>
            </div>
        </div>

        <div id="floating-year" class="floating-year"></div>

        <!-- Decision Modal -->
        <div id="decision-overlay" class="overlay-screen absolute inset-0">
            <div class="max-w-3xl w-full bg-black/90 border border-yellow-600/50 p-8 rounded-lg text-center mx-auto shadow-[0_0_50px_rgba(0,0,0,0.8)]">
                <h3 id="decision-title" class="text-2xl text-yellow-500 font-bold mb-8">重大抉擇</h3>
                <div id="decision-buttons" class="flex flex-col gap-4 justify-center"></div>
            </div>
        </div>

        <!-- Bottom Subtitles -->
        <div id="subtitle-box" class="p-6 md:p-10 w-full text-center flex flex-col items-center">
            <p id="subtitle-text" class="text-lg md:text-xl text-gray-100 max-w-4xl leading-relaxed typewriter inline-block min-h-[60px]"></p>
            <button id="next-text-btn" class="mt-4 text-yellow-500 text-sm tracking-widest hover:text-white transition-colors hidden opacity-0">點擊繼續 ▼</button>
            <button id="start-quiz-btn" class="mt-6 px-8 py-3 bg-yellow-600 text-black font-bold tracking-widest hover:bg-yellow-500 transition-colors hidden opacity-0 shadow-[0_0_15px_rgba(255,215,0,0.4)] rounded-sm">進行最終學習測驗</button>
        </div>
    </div>

    <div id="canvas-container"></div>

<script>
/**
 * 資料設定：遊戲章節與測驗
 */
let originalStats = {};
const STATS = {
    artBelief: { name: '藝術信念', value: 20 },
    landEmotion: { name: '土地情感', value: 70 },
    creationExp: { name: '創作實驗', value: 10 },
    publicPart: { name: '公共參與', value: 5 },
    eraRisk: { name: '時代風險', value: 10 },
    culturalInf: { name: '文化影響力', value: 5 }
};

const LOCATIONS = {
    chiayi: new THREE.Vector3(0, 0, 0),
    tokyo: new THREE.Vector3(40, 10, -30),
    shanghai: new THREE.Vector3(-30, 5, -20),
    taiwan: new THREE.Vector3(5, 5, 5)
};

const CHAPTERS = [
    {
        id: 'intro', year: '1895', title: '嘉義：故鄉起點', sub: '早年困境與失親的童年',
        text: '從高空俯瞰，日治時期的嘉義。街景、樹影、老屋與陽光，這是陳澄波生命初期的不安與韌性。灰藍色霧氣中，微弱的金光象徵著他對這片土地最深情的凝視。',
        camPos: new THREE.Vector3(0, 40, 30), lookAt: LOCATIONS.chiayi,
        action: () => { setFog(0x2a3642, 0.02); createChiayiBase(); },
    },
    {
        id: 'education', year: '1910s', title: '藝術啟蒙走廊', sub: '師範教育之門',
        text: '進入總督府國語學校。水彩、素描線條與畫架的光束交織，在石川欽一郎的啟蒙下，他看見了更大的世界。此時，他面臨了人生第一次重大抉擇。',
        camPos: new THREE.Vector3(0, 15, 20), lookAt: LOCATIONS.chiayi,
        action: () => { drawPath(LOCATIONS.chiayi, new THREE.Vector3(10, 5, -10), 0xffffff); },
        decision: {
            title: '面臨生涯抉擇：畢業後的出路',
            opts: [
                { text: '留在原地安穩教書，不再奢求畫家夢', isHistorical: false, effects: { artBelief: -15, eraRisk: -10, landEmotion: 10 },
                  altTitle: '平靜而庸碌的一生', altText: '你選擇了安穩。陳澄波成為了一名受人愛戴的地方教師，在嘉義平靜地度過了一生。然而，臺灣美術史上少了一位將故鄉陽光帶上國際舞台的巨擎。' },
                { text: '【史實】追尋藝術，不計代價前往東京美術學校', isHistorical: true, effects: { artBelief: 30, eraRisk: 15, landEmotion: -5, creationExp: 20 } }
            ]
        }
    },
    {
        id: 'tokyo', year: '1924', title: '東京：藝術迷宮', sub: '赴日留學與帝展突破',
        text: '金色路線穿越海洋。東京是一座充滿西方學院派訓練的巨大迷宮。1926年，〈嘉義街外（一）〉入選第七回帝展，巨大的金色印章落下！臺灣人的風景，第一次在帝國的藝術殿堂閃耀。',
        camPos: new THREE.Vector3(40, 25, -10), lookAt: LOCATIONS.tokyo,
        action: () => { drawPath(LOCATIONS.chiayi, LOCATIONS.tokyo, 0xd4af37); createTokyoMaze(); setTimeout(() => dropTeitenSeal(), 4000); }
    },
    {
        id: 'shanghai', year: '1929', title: '上海：實驗之城', sub: '任教與東西文化交會',
        text: '畢業後，他前往上海任教。藝專教室、前衛思潮、東西文化在此碰撞。現代城市的節奏交錯流動，他面臨了風格轉型的危機與轉機。',
        camPos: new THREE.Vector3(-30, 20, 10), lookAt: LOCATIONS.shanghai,
        action: () => { drawPath(LOCATIONS.tokyo, LOCATIONS.shanghai, 0x4287f5); createShanghaiLights(); },
        decision: {
            title: '藝術風格的抉擇：面對中西文化衝擊',
            opts: [
                { text: '維持帝展的成功風格，確保藝術地位', isHistorical: false, effects: { creationExp: -20, eraRisk: -5, culturalInf: 10 },
                  altTitle: '迷失在掌聲中的畫筆', altText: '你選擇了保守。陳澄波繼續以傳統學院派風格作畫，雖然不斷入選官方展覽，但他錯過了與中國傳統水墨、前衛思潮碰撞的機會，未能發展出屬於臺灣獨特的狂熱語彙。' },
                { text: '【史實】持續實驗，將東方傳統線條與民間色彩融入西方油彩', isHistorical: true, effects: { creationExp: 40, culturalInf: 20, artBelief: 15 } }
            ]
        }
    },
    {
        id: 'return', year: '1933', title: '返鄉之路', sub: '把世界帶回臺灣',
        text: '從上海飛回臺灣。嘉義、淡水、臺南的地景以狂熱的油畫筆觸浮現。他將世界的養分帶回故鄉，形成一條熾熱的「土地凝視路線」。',
        camPos: new THREE.Vector3(5, 20, 25), lookAt: LOCATIONS.taiwan,
        action: () => { drawPath(LOCATIONS.shanghai, LOCATIONS.taiwan, 0xffa500); createTaiyangConstellation(); },
        decision: {
            title: '生命重心的抉擇：推動美術運動',
            opts: [
                { text: '躲進畫室，專注個人創作不問世事', isHistorical: false, effects: { publicPart: -20, eraRisk: -20, landEmotion: 10 },
                  altTitle: '孤獨的風景畫家', altText: '你選擇了獨善其身。1934年的畫會因為缺乏他的凝聚力而未能壯大。臺灣近代美術啟蒙運動因此延遲了數十年，他在孤獨中作畫，失去了與社會的連結。' },
                { text: '【史實】投入藝術社群，創立「臺陽美術協會」', isHistorical: true, effects: { publicPart: 40, culturalInf: 50, eraRisk: 30 } }
            ]
        }
    },
    {
        id: 'postwar', year: '1945', title: '時代轉換', sub: '公共事務與教育理想',
        text: '戰後，政權更迭。他不只是畫家，更成為滿懷熱血推動文化、參選市參議員的公眾人物。學校藍圖與美術館構想浮現，但遠方天空已聚集象徵動盪的黑雲。',
        camPos: new THREE.Vector3(5, 15, 15), lookAt: LOCATIONS.taiwan,
        action: () => { setFog(0x221111, 0.05); createDarkClouds(); },
        decision: {
            title: '大時代下的抉擇：二二八事件爆發前夕',
            opts: [
                { text: '察覺政治氣氛詭譎，保持沉默專注自保', isHistorical: false, effects: { publicPart: -40, eraRisk: -50, artBelief: -20 },
                  altTitle: '活在沉默中的餘生', altText: '你選擇了明哲保身。陳澄波反鎖家門，躲過了死劫。但在戰後的高壓統治下，他筆下再也畫不出那種燃燒般的生命力，深知自己背叛了對這片土地的承諾。' },
                { text: '【史實】相信公共參與，挺身為地方和平發聲', isHistorical: true, effects: { publicPart: 30, eraRisk: 100, artBelief: 20, landEmotion: 30 } }
            ]
        }
    },
    {
        id: '228', year: '1947', title: '歷史斷裂', sub: '嘉義火車站前的槍聲',
        text: '時間軸突然斷裂。熄滅的街燈、破碎的畫框、靜止的人群。黑色的墨痕在地圖上無情擴散，陳澄波的生命路線在二二八事件中，驟然中斷。',
        camPos: new THREE.Vector3(5, 5, 20), lookAt: LOCATIONS.taiwan,
        action: () => { trigger228Effect(); }
    },
    {
        id: 'outro', year: '永恆', title: '光芒延續', sub: '藝術替土地發聲',
        text: '肉身雖死，藝術永存。他的作品化為一道道光，從中斷處延伸回臺灣山川。陳澄波的一生，是臺灣近代美術在時代裂縫中發光的歷程。肉體會被時代抹殺，但深刻的創作，會在生命結束後，繼續替土地說話。',
        camPos: new THREE.Vector3(0, 80, 0), lookAt: new THREE.Vector3(0,0,0),
        action: () => { triggerOutroLight(); },
        isEnd: true // 觸發測驗按鈕
    }
];

const QUIZ_DATA = [
    {
        q: "1926年，陳澄波在東京美術學校留學期間，以哪一幅畫作入選第七回帝展，將臺灣的故鄉風景帶上日本帝國的藝術殿堂？",
        options: ["〈淡水夕照〉", "〈嘉義街外（一）〉", "〈夏日街景〉", "〈阿里山之春〉"],
        ans: 1,
        rationale: "1926年陳澄波以〈嘉義街外（一）〉入選帝展，是臺灣美術史上的重要里程碑。"
    },
    {
        q: "陳澄波自東京畢業後，前往上海任教。在這個「實驗之城」的階段，他主要面臨了哪一種藝術風格的突破與融合？",
        options: ["追求極簡主義與純粹抽象圖形", "專注於複製西方古典宮廷肖像畫", "放棄油畫，改以水墨畫為唯一媒材", "將東方傳統線條與民間色彩融入西方油彩"],
        ans: 3,
        rationale: "在上海期間，他受到中西文化交會影響，致力將東方筆墨線條與西方油畫技法結合。"
    },
    {
        q: "1933年返臺後，除了個人創作，他選擇了投入藝術社群。1934年，他與多位畫家共同創立了哪一個重要的美術團體？",
        options: ["臺陽美術協會", "臺灣水彩畫會", "東方畫會", "五月畫會"],
        ans: 0,
        rationale: "1934年成立的「臺陽美術協會」是臺灣近代美術史上極為重要、凝聚本土藝術家力量的團體。"
    },
    {
        q: "戰後（1945年後），陳澄波的生命路線與能力值出現轉變，他不僅僅是畫家，更積極投入了哪一項事務？",
        options: ["參與公共事務並推動美術教育理想", "轉行成為全職的政治小說家", "離開臺灣，前往巴黎進行十年巡展", "徹底放棄藝術，轉往經商發展"],
        ans: 0,
        rationale: "戰後他擔任了市參議員，積極推動學校建設與美術館藍圖，將藝術與社會結合。"
    },
    {
        q: "陳澄波壯闊的生命與藝術路線，最終在1947年的哪一場歷史事件中，因為挺身而出為地方和平發聲而遭遇悲劇？",
        options: ["牡丹社事件", "霧社事件", "美麗島事件", "二二八事件"],
        ans: 3,
        rationale: "1947年的二二八事件中，陳澄波作為和平代表前往協商，不幸遭到軍方槍決罹難。"
    }
];

let currentChapterIdx = 0;
let scene, camera, renderer, controls;
let objectsToUpdate = [];
let typewriterTimeout;

let currentQuizIdx = 0;
let quizScore = 0;
let quizAnswered = false;

/* ================= 3D 核心 ================= */
function init3D() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x050505, 0.015);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 100, 100);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xfffaee, 0.8);
    dirLight.position.set(20, 50, 20);
    scene.add(dirLight);

    const mapMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8, metalness: 0.2, wireframe: true, transparent: true, opacity: 0.15 });
    const baseMap = new THREE.Mesh(new THREE.PlaneGeometry(250, 250, 50, 50), mapMat);
    baseMap.rotation.x = -Math.PI / 2;
    scene.add(baseMap);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
}

function animate(time) {
    requestAnimationFrame(animate);
    TWEEN.update(time);
    objectsToUpdate.forEach(obj => obj.update(time));
    
    // Check pause states
    const isPaused = document.getElementById('decision-overlay').classList.contains('active') || 
                     document.getElementById('alternate-overlay').classList.contains('active') ||
                     document.getElementById('quiz-overlay').classList.contains('active');

    if(camera && !isPaused && CHAPTERS[currentChapterIdx]) {
        camera.position.x += Math.sin(time * 0.0003) * 0.008;
        camera.position.z += Math.cos(time * 0.0003) * 0.008;
        camera.lookAt(CHAPTERS[currentChapterIdx].lookAt);
    }
    renderer.render(scene, camera);
}

/* ================= 3D 特效 ================= */
function setFog(colorHex, density) {
    new TWEEN.Tween(scene.fog).to({ density: density }, 3000).start();
    scene.fog.color.setHex(colorHex);
    scene.background.setHex(colorHex);
}
function createBrushStroke(pos, color, scale) {
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(scale*(Math.random()*2+1), scale), mat);
    mesh.position.copy(pos); mesh.position.set(pos.x+(Math.random()-0.5)*6, Math.random()*0.5, pos.z+(Math.random()-0.5)*6);
    mesh.rotation.set(-Math.PI/2, 0, Math.random()*Math.PI);
    scene.add(mesh);
    new TWEEN.Tween(mat).to({ opacity: 0.8 }, 1000).delay(Math.random()*1000).start();
}
function createChiayiBase() {
    for(let i=0; i<35; i++) createBrushStroke(LOCATIONS.chiayi, Math.random()>0.5?0x556b2f:0x8b6508, 2);
    const pl = new THREE.PointLight(0xffd700, 1.5, 30); pl.position.set(0,3,0); scene.add(pl);
}
function drawPath(start, end, colorHex) {
    const curve = new THREE.QuadraticBezierCurve3(start, new THREE.Vector3((start.x+end.x)/2, 20, (start.z+end.z)/2), end);
    const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0, linewidth: 2 });
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(50)), mat));
    new TWEEN.Tween(mat).to({ opacity: 1 }, 2000).start();
    
    const pMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
    const particle = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), pMat); scene.add(particle);
    const prog = { val: 0 };
    new TWEEN.Tween(prog).to({ val: 1 }, 3000).onUpdate(() => particle.position.copy(curve.getPoint(prog.val)))
        .onComplete(() => new TWEEN.Tween(pMat).to({opacity:0}, 500).onComplete(()=>scene.remove(particle)).start()).start();
}
function createTokyoMaze() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x999999, wireframe: true });
    for(let i=0; i<12; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(2,6,2), mat);
        m.position.set(LOCATIONS.tokyo.x+(Math.random()-0.5)*18, 3, LOCATIONS.tokyo.z+(Math.random()-0.5)*18); scene.add(m);
    }
}
function dropTeitenSeal() {
    const seal = new THREE.Mesh(new THREE.CylinderGeometry(4,4,1.5,32), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 }));
    seal.position.set(LOCATIONS.tokyo.x, 30, LOCATIONS.tokyo.z); scene.add(seal);
    new TWEEN.Tween(seal.position).to({ y: 0.75 }, 1200).easing(TWEEN.Easing.Bounce.Out).onComplete(() => {
        const flash = new THREE.PointLight(0xffd700, 3, 60); flash.position.copy(LOCATIONS.tokyo); scene.add(flash);
        new TWEEN.Tween(flash).to({intensity: 0}, 2500).start();
        for(let i=0; i<6; i++) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(2.5, Math.random()*6+2, 2.5), new THREE.MeshStandardMaterial({color: 0xaa5522}));
            b.position.set(LOCATIONS.tokyo.x+(Math.random()-0.5)*12, -5, LOCATIONS.tokyo.z+(Math.random()-0.5)*12); scene.add(b);
            new TWEEN.Tween(b.position).to({y: b.geometry.parameters.height/2}, 1500).easing(TWEEN.Easing.Elastic.Out).start();
        }
    }).start();
}
function createShanghaiLights() {
    const geo = new THREE.BufferGeometry(); const pos = new Float32Array(750); const cols = new Float32Array(750);
    for(let i=0; i<750; i+=3) {
        pos[i]=LOCATIONS.shanghai.x+(Math.random()-0.5)*25; pos[i+1]=Math.random()*12; pos[i+2]=LOCATIONS.shanghai.z+(Math.random()-0.5)*25;
        const c=new THREE.Color().setHSL(Math.random(),1,0.6); cols[i]=c.r; cols[i+1]=c.g; cols[i+2]=c.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.9 }));
    scene.add(pts); objectsToUpdate.push({ update: (time) => pts.rotation.y = time * 0.00015 });
}
function createTaiyangConstellation() {
    const artists = Array.from({length:10}, ()=>new THREE.Vector3(LOCATIONS.taiwan.x+(Math.random()-0.5)*18, LOCATIONS.taiwan.y+Math.random()*6, LOCATIONS.taiwan.z+(Math.random()-0.5)*18));
    artists.forEach(pt => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xffffff})); m.position.copy(pt); scene.add(m); });
    const mat = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4 });
    for(let i=0; i<artists.length; i++) for(let j=i+1; j<artists.length; j++) if(Math.random()>0.4) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([artists[i], artists[j]]), mat));
    const glow = new THREE.PointLight(0x88ccff, 1.5, 40); glow.position.copy(LOCATIONS.taiwan); scene.add(glow);
}
function createDarkClouds() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
    for(let i=0; i<20; i++) {
        const cloud = new THREE.Mesh(new THREE.SphereGeometry(4,16,16), mat);
        cloud.position.set(LOCATIONS.taiwan.x+15+Math.random()*25, 25+Math.random()*10, LOCATIONS.taiwan.z-15-Math.random()*25); scene.add(cloud);
        objectsToUpdate.push({ update: () => cloud.position.x -= 0.015 });
    }
}
function trigger228Effect() {
    scene.children.forEach(c => { if(c.type.includes('Light')) new TWEEN.Tween(c).to({intensity: 0.1}, 1000).start(); });
    const ink = new THREE.Mesh(new THREE.CircleGeometry(1,32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.95, side: THREE.DoubleSide }));
    ink.position.set(LOCATIONS.taiwan.x, 0.1, LOCATIONS.taiwan.z); ink.rotation.x = -Math.PI/2; scene.add(ink);
    new TWEEN.Tween(ink.scale).to({ x:60, y:60, z:60 }, 4000).easing(TWEEN.Easing.Cubic.Out).start();
    const orig = camera.position.clone(); let cnt=0;
    const shake = setInterval(()=>{ if(cnt>25){ clearInterval(shake); camera.position.copy(orig); return; } camera.position.set(orig.x+(Math.random()-0.5)*3, orig.y+(Math.random()-0.5)*3, orig.z); cnt++; }, 40);
}
function triggerOutroLight() {
    const geo = new THREE.BufferGeometry(); const pos = new Float32Array(4500);
    for(let i=0; i<4500; i+=3){ pos[i]=LOCATIONS.taiwan.x; pos[i+1]=0; pos[i+2]=LOCATIONS.taiwan.z; }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffd700, size: 0.8, transparent: true, opacity: 0 });
    const pts = new THREE.Points(geo, mat); scene.add(pts);
    new TWEEN.Tween(mat).to({opacity: 1}, 2000).start();
    objectsToUpdate.push({ update: () => {
        const p = pts.geometry.attributes.position.array;
        for(let i=0; i<4500; i+=3){ p[i]+=(Math.random()-0.5)*0.8; p[i+1]+=Math.random()*0.6; p[i+2]+=(Math.random()-0.5)*0.8; }
        pts.geometry.attributes.position.needsUpdate = true;
    }});
}

/* ================= 劇情控制 ================= */
function updateStatsUI(diffs = null) {
    const container = document.getElementById('stats-container'); container.innerHTML = '';
    Object.keys(STATS).forEach(key => {
        const st = STATS[key]; const diff = diffs&&diffs[key] ? `<span class="stat-diff ${diffs[key]>0?'pos':'neg'}">${diffs[key]>0?'+':''}${diffs[key]}</span>` : '';
        container.innerHTML += `<div><div class="flex justify-between text-xs text-gray-300 items-end"><span>${st.name} ${diff}</span><span class="text-yellow-400 font-bold">${st.value}</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${st.value}%"></div></div></div>`;
    });
}
function applyEffects(effects) {
    if(!effects) return; const diffs = {};
    Object.keys(effects).forEach(key => {
        if(STATS[key]) { const old = STATS[key].value; STATS[key].value = Math.min(100, Math.max(0, STATS[key].value + effects[key])); diffs[key] = STATS[key].value - old; }
    });
    updateStatsUI(diffs);
}
function typeWriter(text, elementId, onComplete, chap) {
    clearTimeout(typewriterTimeout); const el = document.getElementById(elementId); el.innerHTML = ''; let i = 0;
    document.getElementById('next-text-btn').classList.remove('opacity-100'); document.getElementById('next-text-btn').classList.add('hidden', 'opacity-0');
    document.getElementById('start-quiz-btn').classList.remove('opacity-100'); document.getElementById('start-quiz-btn').classList.add('hidden', 'opacity-0');

    function type() {
        if (i < text.length) { el.innerHTML += text.charAt(i); i++; typewriterTimeout = setTimeout(type, 40); } 
        else if(onComplete) onComplete(chap);
    } type();
}

function showDecision(decisionObj) {
    originalStats = JSON.parse(JSON.stringify(STATS));
    const overlay = document.getElementById('decision-overlay');
    document.getElementById('decision-title').innerText = decisionObj.title;
    const btnContainer = document.getElementById('decision-buttons'); btnContainer.innerHTML = '';
    
    decisionObj.opts.forEach(opt => {
        const btn = document.createElement('button'); btn.className = 'btn-choice px-6 py-4 rounded text-left text-white text-lg w-full tracking-wide shadow-lg';
        btn.innerHTML = `<span class="relative z-10">${opt.text}</span>`;
        btn.onclick = () => {
            overlay.classList.remove('active'); applyEffects(opt.effects);
            if(opt.isHistorical) setTimeout(nextChapter, 1500); else setTimeout(() => triggerAlternateEnding(opt), 1000);
        }; btnContainer.appendChild(btn);
    }); overlay.classList.add('active');
}

function triggerAlternateEnding(opt) {
    document.getElementById('canvas-container').classList.add('filter-grayscale');
    const overlay = document.getElementById('alternate-overlay');
    document.getElementById('alt-title').innerText = opt.altTitle; document.getElementById('alt-desc').innerHTML = '';
    overlay.classList.add('active');
    setTimeout(() => typeWriter(opt.altText, 'alt-desc', null), 500);
    
    document.getElementById('rewind-btn').onclick = () => {
        overlay.classList.remove('active'); document.getElementById('canvas-container').classList.remove('filter-grayscale');
        Object.keys(originalStats).forEach(key => STATS[key].value = originalStats[key].value); updateStatsUI();
        setTimeout(() => showDecision(CHAPTERS[currentChapterIdx].decision), 800);
    };
}

function playChapter(index) {
    if(index >= CHAPTERS.length) return; const chap = CHAPTERS[index];
    document.getElementById('location-title').innerText = chap.title;
    document.getElementById('location-sub').innerText = `${chap.year} - ${chap.sub}`;
    document.getElementById('floating-year').innerText = chap.year; document.getElementById('floating-year').style.opacity = '0.2';
    
    new TWEEN.Tween(camera.position).to({ x: chap.camPos.x, y: chap.camPos.y, z: chap.camPos.z }, 4500).easing(TWEEN.Easing.Cubic.InOut).start();
    if(chap.action) chap.action();

    typeWriter(chap.text, 'subtitle-text', (c) => {
        if(c.decision) showDecision(c.decision);
        else if (c.isEnd) {
            // 觸發測驗按鈕
            const btn = document.getElementById('start-quiz-btn'); btn.classList.remove('hidden');
            setTimeout(() => btn.classList.add('opacity-100'), 100);
        } else {
            const btn = document.getElementById('next-text-btn'); btn.classList.remove('hidden');
            setTimeout(() => btn.classList.add('opacity-100'), 100);
            btn.onclick = () => { btn.classList.remove('opacity-100'); btn.classList.add('hidden'); document.getElementById('floating-year').style.opacity = '0'; nextChapter(); };
        }
    }, chap);
}
function nextChapter() { currentChapterIdx++; playChapter(currentChapterIdx); }

/* ================= 最終測驗系統 ================= */
document.getElementById('start-quiz-btn').addEventListener('click', () => {
    document.getElementById('canvas-container').classList.add('filter-blur');
    document.getElementById('quiz-overlay').classList.add('active');
    startQuizSession();
});

function startQuizSession() {
    currentQuizIdx = 0; quizScore = 0;
    document.getElementById('quiz-result-container').classList.add('hidden');
    document.getElementById('quiz-question-container').classList.remove('hidden');
    renderQuizQuestion();
}

function renderQuizQuestion() {
    quizAnswered = false;
    const qData = QUIZ_DATA[currentQuizIdx];
    document.getElementById('quiz-progress').innerText = `${currentQuizIdx + 1} / ${QUIZ_DATA.length}`;
    document.getElementById('quiz-question-text').innerText = qData.q;
    
    const optsContainer = document.getElementById('quiz-options');
    optsContainer.innerHTML = '';
    
    qData.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = optText;
        btn.onclick = () => handleQuizAnswer(i, btn);
        optsContainer.appendChild(btn);
    });
    
    document.getElementById('quiz-feedback').classList.add('hidden');
    document.getElementById('quiz-next-btn').classList.add('hidden');
}

function handleQuizAnswer(selectedIndex, btnElement) {
    if(quizAnswered) return;
    quizAnswered = true;
    const qData = QUIZ_DATA[currentQuizIdx];
    const isCorrect = (selectedIndex === qData.ans);
    
    const allBtns = document.getElementById('quiz-options').children;
    for(let i=0; i<allBtns.length; i++) {
        allBtns[i].style.pointerEvents = 'none';
        if(i === qData.ans) allBtns[i].classList.add('selected-correct');
    }
    
    if(isCorrect) {
        quizScore += 20;
    } else {
        btnElement.classList.add('selected-wrong');
    }
    
    const fb = document.getElementById('quiz-feedback');
    fb.innerHTML = `<strong>${isCorrect ? '✅ 答對了！' : '❌ 答錯了。'}</strong><br>${qData.rationale}`;
    fb.classList.remove('hidden');
    
    document.getElementById('quiz-next-btn').classList.remove('hidden');
}

document.getElementById('quiz-next-btn').addEventListener('click', () => {
    currentQuizIdx++;
    if(currentQuizIdx >= QUIZ_DATA.length) {
        showQuizResult();
    } else {
        renderQuizQuestion();
    }
});

function showQuizResult() {
    document.getElementById('quiz-question-container').classList.add('hidden');
    const resContainer = document.getElementById('quiz-result-container');
    resContainer.classList.remove('hidden');
    resContainer.style.display = 'flex';
    
    const scoreEl = document.getElementById('result-score');
    scoreEl.innerText = quizScore;
    
    const msgEl = document.getElementById('result-message');
    const retryBtn = document.getElementById('retry-quiz-btn');
    const finishBtn = document.getElementById('finish-btn');
    
    retryBtn.classList.add('hidden');
    finishBtn.classList.add('hidden');

    // 規定：超過60分才能過關 ( > 60，即 80 或 100 )
    if(quizScore > 60) {
        scoreEl.className = 'text-6xl font-bold text-green-400 mb-4';
        msgEl.innerText = "恭喜過關！您不僅經歷了陳澄波壯闊而哀傷的藝術旅程，更深刻記住了這段屬於臺灣的歷史記憶。";
        finishBtn.classList.remove('hidden');
    } else {
        scoreEl.className = 'text-6xl font-bold text-red-500 mb-4';
        msgEl.innerText = `很遺憾，您的分數未達標準 (需超過60分)。歷史的細節需要更多的銘記，請重新挑戰測驗！`;
        retryBtn.classList.remove('hidden');
    }
}

document.getElementById('retry-quiz-btn').addEventListener('click', startQuizSession);
document.getElementById('finish-btn').addEventListener('click', () => {
    document.getElementById('quiz-overlay').classList.remove('active');
    document.getElementById('canvas-container').classList.remove('filter-blur');
    // 隱藏全部底部 UI，留給使用者靜靜觀看最後的光芒
    document.getElementById('subtitle-box').style.opacity = '0';
});

// 啟動遊戲
document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    const uiLayer = document.getElementById('ui-layer'); uiLayer.classList.remove('hidden');
    setTimeout(() => uiLayer.classList.remove('opacity-0'), 100);
    init3D(); updateStatsUI(); playChapter(0);
});

</script>
</body>
